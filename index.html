<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: imprescindible para respetar el notch / Dynamic Island / barra home en iOS -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pausa" />
    <!-- Lo ajusta services/theme.js según el tema de la app (no el del sistema) -->
    <meta name="theme-color" content="#ffffff" />
    <!-- Tema ANTES del primer pintado (sin fogonazo blanco en modo oscuro).
         Misma regla que services/theme.js: elección guardada o la del sistema. -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').content = "#000000";
        }
      } catch (e) {}
    </script>
    <title>Pausa</title>

    <!-- PWA: instalable y con icono propio (Añadir a pantalla de inicio en iOS) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Tipografías (Inter + Space Grotesk): se sirven desde la app, ver main.jsx -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
